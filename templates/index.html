<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Safety System</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 { margin-bottom: 15px; }
        h2 { margin-top: 30px; }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .card, .panel, .chartBox {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card { padding: 20px; }

        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #666;
            font-weight: normal;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 10px;
        }

        .normal { color: green; }
        .danger { color: red; }

        .note {
            font-size: 13px;
            font-weight: bold;
            margin-top: 6px;
            min-height: 16px;
            color: #b45309;
        }

        #lastUpdate {
            margin: 20px;
            color: #666;
            font-size: 14px;
        }

        .panel {
            padding: 20px;
            margin-top: 15px;
        }

        button {
            font-size: 16px;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #e5e7eb;
            color: #111827;
            cursor: pointer;
            margin: 4px;
        }

        button.on {
            background: #ef4444;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hint {
            color: #b45309;
            font-size: 13px;
            min-height: 18px;
            margin-top: 8px;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        input[type=number] {
            font-size: 16px;
            padding: 10px;
            width: 90px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        label { font-size: 14px; color: #444; }

        .banner {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .chartBox {
            position: relative;
            height: 300px;
            padding: 15px;
        }

        .tabs button { padding: 8px 14px; font-size: 14px; }

        button.small {
            padding: 6px 12px;
            font-size: 13px;
        }

        #tokenState {
            font-size: 13px;
            color: #444;
        }

        .logList {
            margin-top: 8px;
            font-size: 13px;
            max-height: 160px;
            overflow-y: auto;
        }

        .logList div {
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }

        .tabs button.active {
            background: #111827;
            color: white;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            background: white;
            font-size: 13px;
        }

        th, td { padding: 8px; border: 1px solid #ddd; }
        th { background: #eee; }

        .tableWrap { overflow-x: auto; }

    </style>

</head>

<body>

<div class="container">

    <h1>Smart Safety System</h1>

    <div id="tokenBanner" class="banner" style="display:none">
        Kontrol için erişim anahtarı gerekli.
        <button onclick="askToken()">Anahtar gir</button>
    </div>

    <div class="grid">
        <div class="card"><h3>Sıcaklık</h3><div id="temperature" class="value">--</div></div>
        <div class="card">
            <h3>Nem</h3>
            <div id="humidity" class="value">--</div>
            <div id="humidityNote" class="note"></div>
        </div>
        <div class="card"><h3>Gaz</h3><div id="gas" class="value">--</div></div>
        <div class="card"><h3>Alev</h3><div id="flame" class="value">--</div></div>
        <div class="card"><h3>Fan</h3><div id="fan" class="value">--</div></div>
        <div class="card"><h3>Alarm</h3><div id="alarm" class="value">--</div></div>
    </div>

    <div id="lastUpdate">Son güncelleme: --</div>

    <h2>Kontrol</h2>

    <div class="panel">

        <div class="row">
            <button id="fanBtn" onclick="toggleFan()">Fan</button>
            <button id="muteBtn" onclick="toggleMute()">Sesi kes</button>
        </div>

        <div id="controlHint" class="hint"></div>

        <div class="row" style="margin-top:15px">

            <label>Gaz eşiği
                <input id="gasThreshold" type="number" min="0" max="1023">
            </label>

            <label>Alev eşiği
                <input id="flameThreshold" type="number" min="0" max="1023">
            </label>

            <label title="60 saniyede bu kadar °C yükselirse alarm">Isınma °C/dk
                <input id="tempRise" type="number" min="1" max="30">
            </label>

            <label title="DHT11 en fazla 50 °C ölçebiliyor">Sıcaklık tavanı
                <input id="tempMax" type="number" min="0" max="50">
            </label>

            <button id="saveBtn" onclick="saveThresholds()">Kaydet</button>

        </div>

        <div id="thresholdMsg" class="hint"></div>

        <div class="row" style="margin-top:15px">
            <span id="tokenState" class="small"></span>
            <button class="small" onclick="askToken()">Anahtarı değiştir</button>
            <button class="small" onclick="clearToken()">Anahtarı sil</button>
        </div>

    </div>

    <h2>Grafik</h2>

    <div class="row tabs" id="windowTabs">
        <button data-minutes="1" onclick="setWindow(1)">1 dk</button>
        <button data-minutes="5" onclick="setWindow(5)">5 dk</button>
        <button data-minutes="15" onclick="setWindow(15)">15 dk</button>
        <button data-minutes="60" onclick="setWindow(60)">1 saat</button>
    </div>

    <div class="chartBox" style="margin-top:10px">
        <canvas id="chart"></canvas>
    </div>

    <h2>Alarm ve fan geçmişi</h2>

    <div class="chartBox" style="margin-top:10px">
        <canvas id="alarmChart"></canvas>
    </div>

    <div class="panel" style="text-align:left">
        <strong>Alarm başlangıçları</strong>
        <div id="alarmLog" class="logList"></div>
    </div>

    <h2>Geçmiş</h2>

    <div class="tableWrap">
        <table>
            <thead>
                <tr>
                    <th>Zaman</th><th>Sıcaklık</th><th>Nem</th>
                    <th>Gaz</th><th>Alev</th><th>Fan</th><th>Alarm</th>
                </tr>
            </thead>
            <tbody id="history"></tbody>
        </table>
    </div>

</div>


<script>

const TOKEN_KEY = "sss_token";

// Nem uyari sinirlari. Alarm degil, sadece bilgilendirme:
// fan, buzzer ve bildirim tetiklenmez.
const HUMIDITY_HIGH = 95;
const HUMIDITY_LOW = 5;

let windowMinutes = 15;
let chart = null;
let alarmChart = null;

let deviceFan = null;
let desired = null;


function getToken() {
    return localStorage.getItem(TOKEN_KEY) || "";
}


function askToken() {

    const value = prompt("Erişim anahtarı (Render'daki API_TOKEN):", getToken());

    if (value !== null) {
        localStorage.setItem(TOKEN_KEY, value.trim());
        updateTokenBanner();
        loadCommand();
    }
}


function clearToken() {

    localStorage.removeItem(TOKEN_KEY);
    updateTokenBanner();
}


function updateTokenBanner() {

    const token = getToken();
    const missing = !token;

    document.getElementById("tokenBanner").style.display = missing ? "block" : "none";

    ["fanBtn", "muteBtn", "saveBtn"].forEach(id => {
        document.getElementById(id).disabled = missing;
    });

    // Anahtarin tamamini gostermiyoruz; girilip girilmedigi yeterli.
    document.getElementById("tokenState").innerText =
        missing
            ? "Anahtar girilmedi"
            : "Anahtar: " + token.slice(0, 4) + "…" + token.slice(-4);
}


async function postCommand(patch) {

    if (!getToken()) {
        askToken();
        return null;
    }

    try {

        const response = await fetch("/api/command", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Auth": getToken()
            },
            body: JSON.stringify(patch)
        });

        if (response.status === 401) {
            localStorage.removeItem(TOKEN_KEY);
            updateTokenBanner();
            alert("Anahtar geçersiz, tekrar gir.");
            return null;
        }

        const data = await response.json();

        if (!response.ok) {
            alert("Hata: " + (data.error || response.status));
            return null;
        }

        await loadCommand();
        return data;

    } catch (error) {
        console.error(error);
        alert("Sunucuya ulaşılamadı.");
        return null;
    }
}


async function loadCommand() {

    try {

        const data = await (await fetch("/api/command")).json();

        if (data.error) return;

        desired = data;

        const fanBtn = document.getElementById("fanBtn");
        fanBtn.className = data.fan ? "on" : "";
        fanBtn.innerText = data.fan ? "Fan: AÇIK" : "Fan: KAPALI";

        const muteBtn = document.getElementById("muteBtn");
        muteBtn.className = data.mute ? "on" : "";
        muteBtn.innerText = data.mute ? "Ses: KAPALI" : "Sesi kes";

        const gasInput = document.getElementById("gasThreshold");
        const flameInput = document.getElementById("flameThreshold");

        if (document.activeElement !== gasInput) gasInput.value = data.gas_threshold;
        if (document.activeElement !== flameInput) flameInput.value = data.flame_threshold;

        const riseInput = document.getElementById("tempRise");
        const maxInput = document.getElementById("tempMax");

        if (document.activeElement !== riseInput) riseInput.value = data.temp_rise;
        if (document.activeElement !== maxInput) maxInput.value = data.temp_max;

        updateHint();

    } catch (error) {
        console.error(error);
    }
}


function updateHint() {

    // Komut cihaza ~5 saniyede iniyor. Iyimser gosterim yok:
    // istenen ile cihazin bildirdigi ayni olana kadar "bekliyor".
    const box = document.getElementById("controlHint");

    if (desired === null || deviceFan === null) {
        box.innerText = "";
        return;
    }

    box.innerText =
        (Boolean(desired.fan) && !deviceFan)
            ? "Fan komutu cihaza gönderiliyor..."
            : "";
}


function toggleFan() {
    postCommand({ fan: desired && desired.fan ? 0 : 1 });
}


function toggleMute() {
    postCommand({ mute: desired && desired.mute ? 0 : 1 });
}


async function saveThresholds() {

    const message = document.getElementById("thresholdMsg");

    const result = await postCommand({
        gas_threshold: Number(document.getElementById("gasThreshold").value),
        flame_threshold: Number(document.getElementById("flameThreshold").value),
        temp_rise: Number(document.getElementById("tempRise").value),
        temp_max: Number(document.getElementById("tempMax").value)
    });

    if (result) {
        message.innerText = "Kaydedildi, cihaza iniyor...";
        setTimeout(() => { message.innerText = ""; }, 4000);
    }
}


const show = (value, suffix) =>
    (value === null || value === undefined) ? "--" : value + suffix;


async function loadLatest() {

    try {

        const data = await (await fetch("/api/latest")).json();

        if (!data || !data.id) return;

        document.getElementById("temperature").innerText = show(data.temperature, " °C");
        document.getElementById("humidity").innerText = show(data.humidity, " %");

        const note = document.getElementById("humidityNote");
        const wet = data.humidity;

        if (wet === null || wet === undefined) {
            note.innerText = "";
        } else if (wet >= HUMIDITY_HIGH) {
            note.innerText = "ÇOK NEMLİ";
        } else if (wet <= HUMIDITY_LOW) {
            note.innerText = "ÇOK KURU";
        } else {
            note.innerText = "";
        }
        document.getElementById("gas").innerText = show(data.gas, "");
        document.getElementById("flame").innerText = show(data.flame, "");

        deviceFan = Boolean(data.fan);

        document.getElementById("fan").innerText = data.fan ? "AÇIK" : "KAPALI";

        const alarmBox = document.getElementById("alarm");
        alarmBox.innerText = data.alarm ? "ALARM" : "NORMAL";
        alarmBox.className = data.alarm ? "value danger" : "value normal";

        document.getElementById("lastUpdate").innerText =
            "Son güncelleme: " + new Date(data.created_at).toLocaleString();

        updateHint();

    } catch (error) {
        console.error(error);
    }
}


function setWindow(minutes) {

    windowMinutes = minutes;

    document.querySelectorAll("#windowTabs button").forEach(button => {
        button.className = Number(button.dataset.minutes) === minutes ? "active" : "";
    });

    loadHistory();
}


/**
 * Chart.js kapsayiciyi olcup canvas'i ona gore boyutlandiriyor. Grafik
 * sayfa yerlesimi tamamlanmadan olusursa 0 genislik olculuyor ve kendi
 * ResizeObserver'i "boyut degismedi" diye bir daha tetiklenmiyor --
 * grafik hic gorunmuyor.
 *
 * requestAnimationFrame yetmiyor: sayfa arka planda veya gorunmezken
 * kare cizilmedigi icin geri cagri hic calismayabiliyor. Bu yuzden hem
 * kendi ResizeObserver'imizi takiyoruz hem de her veri yenilemesinde
 * yeniden olcturuyoruz (boyut degismediyse Chart.js zaten islem yapmaz).
 */
function resizeChart(instance, canvasId) {

    const box = document.getElementById(canvasId).parentElement;

    // offsetWidth okumak yerlesimi senkron hesaplatir. Bu olmadan
    // Chart.js kapsayiciyi olcerken 0 gorebiliyor -- yerlesim henuz
    // hesaplanmamissa veya sayfa kare cizmiyorsa (arka plan sekmesi).
    void box.offsetWidth;

    instance.resize();
}


function keepSized(instance, canvasId) {

    resizeChart(instance, canvasId);

    // Zamanlayici, kare cizimine bagli degil: requestAnimationFrame ve
    // ResizeObserver sayfa gorunmezken hic tetiklenmeyebiliyor.
    setTimeout(() => resizeChart(instance, canvasId), 150);

    if (typeof ResizeObserver === "undefined") return;

    // Pencere yeniden boyutlandirilinca da uysun.
    new ResizeObserver(() => resizeChart(instance, canvasId))
        .observe(document.getElementById(canvasId).parentElement);
}


function drawChart(rows) {

    if (typeof Chart === "undefined") return;

    const labels = rows.map(row => new Date(row.created_at).toLocaleTimeString());
    const series = key => rows.map(row => row[key]);

    const datasets = [
        { label: "Sıcaklık", data: series("temperature"), borderColor: "#ef4444", yAxisID: "y" },
        { label: "Nem", data: series("humidity"), borderColor: "#3b82f6", yAxisID: "y" },
        { label: "Gaz", data: series("gas"), borderColor: "#f59e0b", yAxisID: "y1" },
        { label: "Alev", data: series("flame"), borderColor: "#10b981", yAxisID: "y1" }
    ];

    datasets.forEach(set => {
        set.borderWidth = 2;
        set.tension = 0.25;
        set.spanGaps = true;
    });

    if (chart) {
        chart.data.labels = labels;
        chart.data.datasets.forEach((set, i) => { set.data = datasets[i].data; });
        resizeChart(chart, "chart");
        chart.update("none");
        return;
    }

    // Sicaklik/nem 0-100, gaz/alev 0-1023. Tek eksende sicaklik gorunmez olur.
    const scales = {
        y: { position: "left", suggestedMin: 0, suggestedMax: 100 },
        y1: {
            position: "right",
            suggestedMin: 0,
            suggestedMax: 1023,
            grid: { drawOnChartArea: false }
        },
        x: { ticks: { maxTicksLimit: 6 } }
    };

    chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: { labels: labels, datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            elements: { point: { radius: 0 } },
            interaction: { mode: "index", intersect: false },
            scales: scales
        }
    });

    // Grafik, sayfa yerlesimi tamamlanmadan olusabiliyor; o anda kapsayici
    // 0 genislikte olculuyor ve Chart.js'in ResizeObserver'i boyut
    // "degismedigi" icin bir daha tetiklenmiyor -- grafik hic gorunmuyor.
    // Yerlesim kesinlestikten sonra bir kez daha olcturuyoruz.
    keepSized(chart, "chart");
}


/**
 * Alarmin sebebi veritabaninda tutulmuyor, sadece alarm biti var.
 * Kayitli gaz/alev degerlerini guncel esiklerle karsilastirip cikariyoruz.
 *
 * Sinirlamasi: esikler sonradan degistirildiyse eski kayitlarin sebebi
 * yeni esige gore hesaplanir. Cihazdaki kural birebir ayni.
 */
function alarmCause(row, rows, index) {

    const gasLimit = desired ? desired.gas_threshold : 400;
    const flameLimit = desired ? desired.flame_threshold : 80;
    const riseLimit = desired ? desired.temp_rise : 5;
    const maxLimit = desired ? desired.temp_max : 45;

    const temp = row.temperature;
    const has = v => v !== null && v !== undefined;

    // Cihaz 60 saniyelik pencereye bakiyor; burada da ayni pencere,
    // gecmis dizisinde 60 saniye onceki kayit aranarak bulunuyor.
    let rise = false;

    if (has(temp) && Array.isArray(rows) && index > 0) {

        const now = new Date(row.created_at).getTime();

        for (let i = index - 1; i >= 0; i--) {

            const past = new Date(rows[i].created_at).getTime();

            if (now - past >= 60000) {
                rise = has(rows[i].temperature) &&
                       (temp - rows[i].temperature) >= riseLimit;
                break;
            }
        }
    }

    return {
        gas: has(row.gas) && row.gas >= gasLimit,
        flame: has(row.flame) && row.flame <= flameLimit,
        tempMax: has(temp) && temp >= maxLimit,
        tempRise: rise
    };
}


function drawAlarmChart(rows) {

    if (typeof Chart === "undefined") return;

    const labels = rows.map(row => new Date(row.created_at).toLocaleTimeString());

    // Ucu de 0/1. Tam ust uste cizilirse biri digerini tamamen gizler,
    // bu yuzden her seri biraz farkli yukseklikte duruyor.
    const datasets = [
        {
            label: "Gaz alarmı",
            data: rows.map((row, i) => alarmCause(row, rows, i).gas ? 1 : 0),
            borderColor: "#f59e0b",
            backgroundColor: "rgba(245,158,11,0.25)"
        },
        {
            label: "Alev alarmı",
            data: rows.map((row, i) => alarmCause(row, rows, i).flame ? 0.92 : 0),
            borderColor: "#ef4444",
            backgroundColor: "rgba(239,68,68,0.25)"
        },
        {
            label: "Sıcaklık alarmı",
            data: rows.map((row, i) => {
                const c = alarmCause(row, rows, i);
                return (c.tempMax || c.tempRise) ? 0.84 : 0;
            }),
            borderColor: "#8b5cf6",
            backgroundColor: "rgba(139,92,246,0.25)"
        },
        {
            label: "Fan",
            data: rows.map(row => row.fan ? 0.76 : 0),
            borderColor: "#3b82f6",
            backgroundColor: "rgba(59,130,246,0.15)"
        }
    ];

    // Basamak cizgisi: 0/1 degerleri egimli cizilirse olmayan
    // ara durumlar varmis gibi gorunur.
    datasets.forEach(set => {
        set.stepped = true;
        set.fill = true;
        set.borderWidth = 2;
        set.pointRadius = 0;
    });

    if (alarmChart) {
        alarmChart.data.labels = labels;
        alarmChart.data.datasets.forEach((set, i) => { set.data = datasets[i].data; });
        resizeChart(alarmChart, "alarmChart");
        alarmChart.update("none");
        return;
    }

    const scales = {
        y: {
            min: -0.1,
            max: 1.1,
            ticks: {
                stepSize: 1,
                callback: value => value === 1 ? "VAR" : (value === 0 ? "YOK" : "")
            }
        },
        x: { ticks: { maxTicksLimit: 6 } }
    };

    alarmChart = new Chart(document.getElementById("alarmChart"), {
        type: "line",
        data: { labels: labels, datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            interaction: { mode: "index", intersect: false },
            scales: scales
        }
    });

    keepSized(alarmChart, "alarmChart");
}


function fillAlarmLog(rows) {

    const box = document.getElementById("alarmLog");

    // Sadece 0 -> 1 gecisleri. Alarm suresince her satiri listelemek
    // tek bir olayi yuzlerce satir gibi gosterirdi.
    const events = [];
    let previous = false;

    rows.forEach((row, index) => {

        const now = Boolean(row.alarm);

        if (now && !previous) {

            const cause = alarmCause(row, rows, index);
            const reasons = [];

            if (cause.gas) reasons.push("Gaz " + row.gas);
            if (cause.flame) reasons.push("Alev " + row.flame);
            if (cause.tempMax) reasons.push("Sıcaklık " + row.temperature + "°C");
            if (cause.tempRise) reasons.push("Hızlı ısınma (" + row.temperature + "°C)");

            events.push(
                new Date(row.created_at).toLocaleString() +
                " — " +
                (reasons.length ? reasons.join(" + ") : "sebep eşiklerden çıkarılamadı")
            );
        }

        previous = now;
    });

    box.innerHTML = events.length
        ? events.slice(-20).reverse().map(t => "<div>" + t + "</div>").join("")
        : "<div>Bu aralıkta alarm yok</div>";
}


function fillTable(rows) {

    const table = document.getElementById("history");

    table.innerHTML = "";

    const cell = value => (value === null || value === undefined) ? "--" : value;

    rows.slice().reverse().slice(0, 50).forEach(row => {

        const tr = document.createElement("tr");

        tr.innerHTML =
            "<td>" + new Date(row.created_at).toLocaleTimeString() + "</td>" +
            "<td>" + cell(row.temperature) + "</td>" +
            "<td>" + cell(row.humidity) + "</td>" +
            "<td>" + cell(row.gas) + "</td>" +
            "<td>" + cell(row.flame) + "</td>" +
            "<td>" + (row.fan ? "AÇIK" : "KAPALI") + "</td>" +
            "<td>" + (row.alarm ? "ALARM" : "NORMAL") + "</td>";

        table.appendChild(tr);
    });
}


async function loadHistory() {

    try {

        const rows = await (await fetch("/api/history?minutes=" + windowMinutes)).json();

        if (!Array.isArray(rows)) return;

        drawChart(rows);
        drawAlarmChart(rows);
        fillAlarmLog(rows);
        fillTable(rows);

    } catch (error) {
        console.error(error);
    }
}


function refresh() {
    loadLatest();
    loadCommand();
}

updateTokenBanner();
setWindow(15);
refresh();

setInterval(refresh, 3000);
setInterval(loadHistory, 10000);

</script>

</body>

</html>
